<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient (Camden black to dark grey) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGradient)"/>

  <!-- Camden logo box (top-left) - white rounded box -->
  <rect x="50" y="30" width="200" height="80" fill="#ffffff" rx="10"/>
  <text x="150" y="55" font-size="14" font-weight="700" fill="#000" text-anchor="middle" font-family="Arial, sans-serif">Camden Council</text>
  <circle cx="150" cy="80" r="10" fill="#c1006f"/>

  <!-- Textra badge (top-right) -->
  <circle cx="1200" cy="70" r="50" fill="#ffffff"/>
  <text x="1200" y="90" font-size="60" font-weight="bold" fill="#c1006f" text-anchor="middle" font-family="Arial, sans-serif">T</text>

  <!-- Main content area -->
  <!-- Video overview label -->
  <text x="80" y="170" font-size="14" font-weight="700" fill="#c1006f" letter-spacing="3" font-family="Arial, sans-serif">VIDEO OVERVIEW</text>

  <!-- Main title -->
  <text x="80" y="260" font-size="72" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">Visitor Parking</text>
  <text x="80" y="350" font-size="72" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">Permits</text>

  <!-- Video controls section -->
  <!-- Dark overlay for bottom -->
  <rect x="0" y="480" width="1280" height="240" fill="#000000" opacity="0.4"/>

  <!-- Play button -->
  <polygon points="80,580 80,660 160,620" fill="#c1006f" opacity="0.95"/>

  <!-- Time display -->
  <text x="180" y="635" font-size="20" fill="#ffffff" font-family="Arial, sans-serif">0:00 / 1:11</text>

  <!-- Volume icon -->
  <text x="1100" y="635" font-size="26" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">🔊</text>

  <!-- Fullscreen icon -->
  <text x="1160" y="635" font-size="26" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">⛶</text>

  <!-- More options -->
  <text x="1220" y="635" font-size="28" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">⋯</text>

  <!-- Progress bar background -->
  <rect x="80" y="660" width="1120" height="6" fill="#666666" rx="3"/>

  <!-- Progress bar fill -->
  <rect x="80" y="660" width="100" height="6" fill="#c1006f" rx="3"/>
</svg>