<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#273572;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A71B1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BCAD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg-grad)"/>

  <!-- Main content -->
  <g>
    <!-- Title -->
    <text x="30" y="60" font-size="32" font-weight="700" fill="white" font-family="system-ui, -apple-system, sans-serif">
      The PDF Paradox
    </text>

    <!-- Subtitle -->
    <text x="30" y="95" font-size="16" fill="rgba(255,255,255,0.9)" font-family="system-ui, -apple-system, sans-serif">
      Why enterprises ignore what they know
    </text>

    <!-- Divider -->
    <line x1="30" y1="115" x2="570" y2="115" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Data visualization -->
    <!-- Video bar label -->
    <text x="30" y="175" font-size="14" font-weight="600" fill="white" font-family="system-ui, -apple-system, sans-serif">
      Video Retention
    </text>

    <!-- Video bar -->
    <rect x="30" y="185" width="475" height="50" fill="rgba(102, 188, 173, 0.3)" rx="4"/>
    <rect x="30" y="185" width="451" height="50" fill="#66BCAD" rx="4"/>
    <text x="500" y="218" font-size="18" font-weight="700" fill="white" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">
      95%
    </text>

    <!-- PDF bar label -->
    <text x="30" y="280" font-size="14" font-weight="600" fill="white" font-family="system-ui, -apple-system, sans-serif">
      Text/PDF Retention
    </text>

    <!-- PDF bar -->
    <rect x="30" y="290" width="475" height="50" fill="rgba(212, 114, 93, 0.3)" rx="4"/>
    <rect x="30" y="290" width="48" height="50" fill="#D4725D" rx="4"/>
    <text x="500" y="323" font-size="18" font-weight="700" fill="white" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">
      10%
    </text>

    <!-- Gap indicator -->
    <text x="30" y="365" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)" font-family="system-ui, -apple-system, sans-serif">
      85-point gap • 20+ years of research
    </text>
  </g>
</svg>
